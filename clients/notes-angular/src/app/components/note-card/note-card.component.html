<p-card class="card-container" [pt]="cardPt" (click)="handleCardClick()">
  <ng-template #header>
    <div class="card-header">
      <div class="title-row">
        <h3 class="text-trim" [style.color]="cardTextColor()">{{ note.title }}</h3>
        @if (isShared) {
          <span class="shared-badge" pTooltip="{{ 'NOTES.SHARED' | translate }}">
            <i class="pi pi-users"></i>
          </span>
        }
      </div>
      <p-menu #menu [model]="items" popup="true" [appendTo]="'body'" ></p-menu>
      <div class="controls">
        <p-button
          [pt]="controlButtonPt"
          variant="text"
          pTooltip="{{ (note.pinned ? 'NOTES.UNPIN' : 'NOTES.PIN') | translate }}"
          (onClick)="onPinClick($event)"
        >
          <i class="pi pi-thumbtack"></i>
        </p-button>
        <p-button
          [pt]="controlButtonPt"
          variant="text"
          pTooltip="{{ 'NOTES.MORE' | translate }}"
          (onClick)="onMenuClick($event, menu)"
        >
          <i class="pi pi-ellipsis-v"></i>
        </p-button>
      </div>
    </div>
    <app-note-change-datetime [note]="note"></app-note-change-datetime>

  </ng-template>

  <div class="text-trim" [style.color]="cardTextColor()">{{ note.content }}</div>
</p-card>
